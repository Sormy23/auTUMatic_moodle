[project]
name = "tum-moodle-sync"
version = "0.1.0"
description = "Sync all files from TUM Moodle to a local folder"
authors = [
    { name = "Sormy23", email = "sven.oberwalder@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
tum-moodle-sync = "tum_moodle_sync:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
